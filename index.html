<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LemonBox</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   LEMONBOX V2.6 — CSS
═══════════════════════════════════════════ */
:root {
  --bg:#080b10; --surface:#0e1219; --card:#131923;
  --border:#1e2738; --bh:#2e3d55;
  --text:#e2e8f4; --muted:#5a6a85; --dim:#3a4a62;
  --lemon:#facc15;
  --c0:#f472b6; --c0b:rgba(244,114,182,.13);
  --c1:#34d399; --c1b:rgba(52,211,153,.13);
  --c2:#60a5fa; --c2b:rgba(96,165,250,.13);
  --c3:#fb923c; --c3b:rgba(251,146,60,.13);
  --c4:#a78bfa; --c4b:rgba(167,139,250,.13);
  --c5:#f87171; --c5b:rgba(248,113,113,.13);
  --c6:#38bdf8; --c6b:rgba(56,189,248,.13);
  --c7:#4ade80; --c7b:rgba(74,222,128,.13);
  --card-h:320px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.28;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");}

/* HEADER */
header{position:sticky;top:0;z-index:300;background:rgba(8,11,16,.93);
  backdrop-filter:blur(18px);border-bottom:1px solid var(--border);
  padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo{font-family:'Space Mono',monospace;font-size:.98rem;font-weight:700;
  display:flex;align-items:center;gap:8px;flex-shrink:0;}
.logo-icon{width:28px;height:28px;background:linear-gradient(135deg,#facc15,#fb923c);
  border-radius:7px;display:grid;place-items:center;font-size:.85rem;}
.logo-name span{background:linear-gradient(90deg,#facc15,#fb923c);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-ver{font-family:'Space Mono',monospace;font-size:.5rem;font-weight:700;
  background:var(--border);color:var(--lemon);padding:2px 5px;border-radius:4px;margin-left:2px;}
.hdr-right{display:flex;align-items:center;gap:6px;}
.sync-badge{font-family:'Space Mono',monospace;font-size:.6rem;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);
  padding:3px 9px;border-radius:99px;white-space:nowrap;transition:all .3s;}
.sync-badge.loading{color:var(--lemon);border-color:rgba(250,204,21,.35);animation:blink 1.4s infinite;}
.sync-badge.ok   {color:#34d399;border-color:rgba(52,211,153,.35);}
.sync-badge.err  {color:#f87171;border-color:rgba(248,113,113,.35);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.hbtn{font-family:'Space Mono',monospace;font-size:.66rem;font-weight:700;letter-spacing:.3px;
  padding:7px 11px;border-radius:7px;border:none;cursor:pointer;white-space:nowrap;
  transition:all .18s;display:flex;align-items:center;gap:5px;}
.hbtn-sync {background:transparent;color:var(--muted);border:1px solid var(--border);}
.hbtn-sync:hover{color:var(--lemon);border-color:var(--lemon);}
.hbtn-stats{background:transparent;color:var(--muted);border:1px solid var(--border);}
.hbtn-stats:hover{color:#a78bfa;border-color:#a78bfa;}
.hbtn-fav  {background:transparent;color:var(--muted);border:1px solid var(--border);}
.hbtn-fav.active{color:var(--lemon);border-color:var(--lemon);background:rgba(250,204,21,.07);}
.hlbl{display:inline;}

/* NAV */
.nav-cats{position:sticky;top:56px;z-index:290;background:rgba(8,11,16,.93);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;padding:0 1.5rem;}
.nav-cats::-webkit-scrollbar{display:none;}
.nav-cat{font-family:'Space Mono',monospace;font-size:.64rem;font-weight:700;letter-spacing:.3px;
  padding:0 13px;height:44px;border:none;background:transparent;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
  transition:color .18s,border-color .18s;display:flex;align-items:center;gap:5px;}
.nav-cat:hover{color:var(--text);}
.nav-cat .nc{font-size:.52rem;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:99px;}

/* SUBCAT */
.subcat-bar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:7px 1.5rem;display:flex;gap:6px;align-items:center;
  overflow-x:auto;scrollbar-width:none;min-height:43px;}
.subcat-bar::-webkit-scrollbar{display:none;}
.subcat-bar.hidden{display:none;}
.sub-lbl{font-family:'Space Mono',monospace;font-size:.57rem;color:var(--dim);flex-shrink:0;margin-right:2px;}
.spill{font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700;
  padding:4px 11px;border-radius:99px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.spill:hover{color:var(--text);border-color:var(--dim);}

/* TOOLBAR */
.toolbar{max-width:1300px;margin:0 auto;padding:1rem 1.5rem .8rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.tb-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.gc{font-family:'Space Mono',monospace;font-size:.67rem;color:var(--muted);}
.sort-sel{font-family:'Space Mono',monospace;font-size:.63rem;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);border-radius:7px;
  padding:5px 9px;outline:none;cursor:pointer;appearance:none;}
.sort-sel option{background:var(--card);}
.srch{position:relative;}
.srch input{padding:9px 16px 9px 35px;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;
  outline:none;transition:border .2s,box-shadow .2s;width:min(240px,74vw);}
.srch input:focus{border-color:var(--dim);box-shadow:0 0 0 3px rgba(94,114,133,.1);}
.srch input::placeholder{color:var(--muted);}
.srch-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:.84rem;pointer-events:none;}

/* GRID */
.grid-wrap{max-width:1300px;margin:0 auto 6rem;padding:0 1.5rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px;}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;
  overflow:hidden;display:flex;flex-direction:column;height:var(--card-h);
  transition:transform .2s,border-color .2s,box-shadow .2s;
  animation:fadeUp .3s ease both;position:relative;cursor:pointer;}
.card:hover{transform:translateY(-3px);border-color:var(--bh);box-shadow:0 14px 36px rgba(0,0,0,.5);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  border-radius:13px 13px 0 0;opacity:0;transition:opacity .2s;}
.card:hover::before{opacity:1;}

/* fav btn on card */
.c-fav{position:absolute;top:7px;right:7px;z-index:3;width:26px;height:26px;
  border-radius:6px;border:none;cursor:pointer;
  background:rgba(8,11,16,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;font-size:.78rem;transition:all .2s;opacity:0;}
.card:hover .c-fav,.c-fav.on{opacity:1;}
.c-fav.on{background:rgba(250,204,21,.18);}

/* source badge */
.c-src{position:absolute;top:7px;left:7px;z-index:3;
  font-family:'Space Mono',monospace;font-size:.49rem;font-weight:700;letter-spacing:.3px;
  padding:2px 6px;border-radius:5px;backdrop-filter:blur(4px);}
.c-src.gh {background:rgba(8,11,16,.75);color:var(--lemon);border:1px solid rgba(250,204,21,.3);}
.c-src.ext{background:rgba(8,11,16,.75);color:#60a5fa;border:1px solid rgba(96,165,250,.3);}

/* thumb */
.c-thumb{width:100%;height:120px;overflow:hidden;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);}
.c-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.card:hover .c-thumb img{transform:scale(1.05);}
.c-thumb-ph{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;}
.ph-ic{font-size:2rem;}
.ph-ft{font-family:'Space Mono',monospace;font-size:.52rem;color:var(--dim);letter-spacing:1px;}

/* body */
.c-body{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:5px;overflow:hidden;min-height:0;}
.c-tags{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.tag{font-family:'Space Mono',monospace;font-size:.57rem;font-weight:700;
  letter-spacing:.3px;padding:2px 7px;border-radius:99px;border:1px solid;white-space:nowrap;}
.tag-sub{color:var(--muted);background:var(--surface);border-color:var(--border);}
.c-title{font-family:'Space Mono',monospace;font-size:.82rem;font-weight:700;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0;}
.c-desc{font-size:.76rem;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.c-chips{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0;}
.chip{font-family:'Space Mono',monospace;font-size:.54rem;font-weight:700;
  letter-spacing:.3px;padding:2px 7px;border-radius:4px;}
/* platform chips */
.ch-github   {background:#1b2129;color:#8b949e;border:1px solid #30363d;}
.ch-mega     {background:#6b0f0f;color:#fca5a5;border:1px solid #991b1b;}
.ch-terabox  {background:#003d7a;color:#93c5fd;border:1px solid #0066cc;}
.ch-drive    {background:#0f4a2a;color:#6ee7b7;border:1px solid #1a7a4a;}
.ch-mediafire{background:#1a3a5c;color:#93c5fd;border:1px solid #1d4ed8;}
.ch-dropbox  {background:#003380;color:#93c5fd;border:1px solid #1d4ed8;}
.ch-onedrive {background:#0a3a6e;color:#93c5fd;border:1px solid #1d4ed8;}
.ch-ext      {background:#1f2937;color:#9ca3af;border:1px solid #374151;}
.ch-fmt      {background:var(--border);color:var(--muted);border:1px solid var(--dim);}

/* footer */
.c-foot{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:5px;flex-shrink:0;}
.btn-ver{flex:1;font-family:'Space Mono',monospace;font-size:.66rem;font-weight:700;
  padding:7px 6px;border-radius:7px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:4px;
  color:var(--bg);transition:opacity .18s,transform .18s;}
.btn-ver:hover{opacity:.85;transform:translateY(-1px);}
.btn-dl{font-family:'Space Mono',monospace;font-size:.63rem;font-weight:700;
  padding:7px 8px;border-radius:7px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  transition:all .18s;flex-shrink:0;text-decoration:none;
  display:flex;align-items:center;justify-content:center;}
.btn-dl:hover{color:var(--text);border-color:var(--dim);}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted);}
.empty-ic{font-size:2.6rem;margin-bottom:1rem;opacity:.45;}
.empty h3{font-family:'Space Mono',monospace;font-size:.9rem;margin-bottom:.4rem;color:var(--text);}
.empty p{font-size:.78rem;}

/* ═══ MODALS BASE ═══ */
.ov{position:fixed;inset:0;z-index:400;background:rgba(8,11,16,.93);
  backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:1rem;}
.ov.open{display:flex;}
@keyframes mIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ═══ DETAIL MODAL ═══ */
.dm{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  width:100%;max-width:580px;max-height:93vh;overflow-y:auto;
  animation:mIn .22s ease;-webkit-overflow-scrolling:touch;}
.dm-hero{width:100%;height:210px;overflow:hidden;border-radius:18px 18px 0 0;
  position:relative;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;}
.dm-hero img{width:100%;height:100%;object-fit:cover;}
.dm-hero-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:4.5rem;}
.dm-close{position:absolute;top:11px;right:11px;width:32px;height:32px;border-radius:8px;
  background:rgba(8,11,16,.82);backdrop-filter:blur(4px);border:1px solid var(--border);
  cursor:pointer;color:var(--text);font-size:.88rem;display:grid;place-items:center;z-index:2;}
.dm-close:hover{background:var(--surface);}
.dm-fav-btn{position:absolute;top:11px;right:50px;width:32px;height:32px;border-radius:8px;
  background:rgba(8,11,16,.82);backdrop-filter:blur(4px);border:1px solid var(--border);
  cursor:pointer;font-size:.88rem;display:grid;place-items:center;z-index:2;transition:all .2s;}
.dm-fav-btn.on{background:rgba(250,204,21,.15);border-color:rgba(250,204,21,.4);}
.dm-body{padding:20px 22px 26px;display:flex;flex-direction:column;gap:14px;}
.dm-title{font-family:'Space Mono',monospace;font-size:1.05rem;font-weight:700;line-height:1.3;}
.dm-desc{font-size:.85rem;color:var(--muted);line-height:1.6;}
.dm-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.dm-mi{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 11px;}
.dm-ml{font-family:'Space Mono',monospace;font-size:.55rem;color:var(--dim);
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px;}
.dm-mv{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--text);word-break:break-all;}
.dm-tags{display:flex;gap:5px;flex-wrap:wrap;}
.dm-url{font-family:'Space Mono',monospace;font-size:.63rem;color:var(--muted);
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:8px 11px;word-break:break-all;line-height:1.5;}
.dm-acts{display:flex;gap:8px;flex-wrap:wrap;}
.dmbtn{font-family:'Space Mono',monospace;font-size:.7rem;font-weight:700;
  padding:9px 15px;border-radius:8px;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:all .18s;text-decoration:none;}
.dmbtn-p{color:var(--bg);}
.dmbtn-p:hover{opacity:.85;}
.dmbtn-g{background:transparent;color:var(--muted);border:1px solid var(--border);}
.dmbtn-g:hover{color:var(--text);border-color:var(--dim);}

/* viewer inside modal */
.viewer{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.viewer iframe{width:100%;height:440px;display:block;border:none;}
.viewer img   {width:100%;max-height:440px;object-fit:contain;display:block;}
.viewer video {width:100%;max-height:380px;display:block;}
.viewer audio {width:100%;display:block;padding:12px;}
.viewer-info  {padding:14px;font-size:.82rem;color:var(--muted);line-height:1.6;}

/* ═══ STATS MODAL ═══ */
.sm{background:var(--surface);border:1px solid var(--border);border-radius:18px;
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  animation:mIn .22s ease;padding:24px;-webkit-overflow-scrolling:touch;}
.sm-title{font-family:'Space Mono',monospace;font-size:.98rem;font-weight:700;
  margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.sm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.sm-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.sm-n{font-family:'Space Mono',monospace;font-size:1.55rem;font-weight:700;color:var(--lemon);}
.sm-l{font-size:.75rem;color:var(--muted);margin-top:2px;}
.sm-sec{margin-top:14px;}
.sm-sec h3{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--dim);
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.sm-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--border);font-size:.8rem;}
.sm-row:last-child{border-bottom:none;}
.sm-bar{height:3px;border-radius:99px;margin-top:2px;}

/* TOASTS */
.tc{position:fixed;bottom:20px;right:20px;z-index:600;display:flex;flex-direction:column;gap:7px;}
.toast{font-family:'Space Mono',monospace;font-size:.66rem;padding:9px 13px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  display:flex;align-items:center;gap:7px;max-width:260px;
  animation:tIn .26s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.ok  {border-color:rgba(52,211,153,.4);}
.toast.err {border-color:rgba(248,113,113,.4);}
.toast.inf {border-color:rgba(250,204,21,.3);}
@keyframes tIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}

/* RESPONSIVE */
@media(max-width:640px){
  header{padding:0 1rem;}
  .hlbl,.sync-badge{display:none;}
  .hbtn{padding:7px 9px;}
  .nav-cats,.subcat-bar,.toolbar,.grid-wrap{padding-left:1rem;padding-right:1rem;}
  .grid{grid-template-columns:1fr 1fr;gap:10px;}
  :root{--card-h:290px;}
  .c-thumb{height:95px;}
  .dm-meta{grid-template-columns:1fr;}
  .sm-grid{grid-template-columns:1fr;}
}
@media(max-width:380px){.grid{grid-template-columns:1fr;}:root{--card-h:310px;}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">🍋</div>
    <div class="logo-name">Lemon<span>Box</span><span class="logo-ver">V2.6</span></div>
  </div>
  <div class="hdr-right">
    <span class="sync-badge loading" id="syncBadge">Cargando…</span>
    <button class="hbtn hbtn-sync"  onclick="fullSync()"   title="Sincronizar">↻ <span class="hlbl">Sync</span></button>
    <button class="hbtn hbtn-stats" onclick="openStats()"  title="Estadísticas">◈ <span class="hlbl">Stats</span></button>
    <button class="hbtn hbtn-fav"   id="favBtn" onclick="toggleFavFilter()" title="Favoritos">⭐ <span class="hlbl">Favs</span></button>
  </div>
</header>

<!-- NAV CATS -->
<nav class="nav-cats" id="navCats">
  <button class="nav-cat active" data-cat="all" onclick="setFilter('all')">
    Todo <span class="nc" id="cnt-all">0</span>
  </button>
</nav>

<!-- SUBCAT BAR -->
<div class="subcat-bar hidden" id="subcatBar"></div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="tb-left">
    <span class="gc" id="gc">0 items</span>
    <select class="sort-sel" id="sortSel" onchange="renderGrid()">
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
      <option value="cat">Categoría</option>
      <option value="fmt">Formato</option>
    </select>
  </div>
  <div class="srch">
    <span class="srch-ic">🔍</span>
    <input type="text" id="srchInput" placeholder="Buscar nombre, formato, categoría, tag…" oninput="renderGrid()">
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap"><div class="grid" id="grid"></div></div>

<!-- DETAIL MODAL -->
<div class="ov" id="dmOv" onclick="if(event.target.id==='dmOv')closeDM()">
  <div class="dm">
    <div class="dm-hero" id="dmHero">
      <button class="dm-close"    onclick="closeDM()">✕</button>
      <button class="dm-fav-btn"  id="dmFavBtn" onclick="toggleFavDM()">☆</button>
    </div>
    <div class="dm-body">
      <div class="dm-title"  id="dmTitle"></div>
      <div class="dm-desc"   id="dmDesc"></div>
      <div class="dm-meta"   id="dmMeta"></div>
      <div class="dm-tags"   id="dmTags"></div>
      <div class="dm-url"    id="dmUrl"></div>
      <div id="dmViewer"></div>
      <div class="dm-acts"   id="dmActs"></div>
    </div>
  </div>
</div>

<!-- STATS MODAL -->
<div class="ov" id="smOv" onclick="if(event.target.id==='smOv')closeStats()">
  <div class="sm">
    <div class="sm-title">Estadísticas <button class="dm-close" style="position:static" onclick="closeStats()">✕</button></div>
    <div id="smContent"></div>
  </div>
</div>

<!-- TOASTS -->
<div class="tc" id="tc"></div>

<script>
/* ═══════════════════════════════════════════
   LEMONBOX V2.5 — JAVASCRIPT

// ── CONFIG ──────────────────────────────────
const CFG = {
  owner:    'infoboxmas',
  repo:     'LemonVault',
  branch:   'main',
  favKey:   'lb25_favs',
  cacheKey: 'lb25_cache',
  cacheTTL: 5 * 60 * 1000, // 5 min
};
const API  = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents`;
const RAW  = `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}`;

// ── FORMAT & TYPE DETECTION ─────────────────
const TYPE_MAP = {
  // books
  pdf:'book',epub:'book',
  // comics
  cbz:'comic',cbr:'comic',
  // images
  jpg:'image',jpeg:'image',png:'image',webp:'image',gif:'image',
  // audio
  mp3:'audio',wav:'audio',flac:'audio',ogg:'audio',aac:'audio',
  // video
  mp4:'video',webm:'video',mkv:'video',avi:'video',mov:'video',
  // apps
  apk:'app',exe:'app',msi:'app',dmg:'app',
  // archives
  zip:'archive',rar:'archive','7z':'archive',tar:'archive',
  // docs
  txt:'doc',md:'doc',docx:'doc',xlsx:'doc',pptx:'doc',
};
const TYPE_ICONS = {
  book:'📚',comic:'📖',image:'🖼',audio:'🎵',video:'🎬',
  app:'📱',archive:'📦',doc:'📝',link:'🔗',unknown:'📄',
};
const TYPE_LABELS = {
  book:'Libro',comic:'Cómic',image:'Imagen',audio:'Audio',video:'Video',
  app:'Aplicación',archive:'Archivo',doc:'Documento',link:'Enlace',unknown:'Archivo',
};

function detectType(name='', url=''){
  const ext = (name.split('.').pop()||'').toLowerCase();
  if(TYPE_MAP[ext]) return { type:TYPE_MAP[ext], ext:ext.toUpperCase(), raw:ext };
  // if no extension but has url → link
  if(url) return { type:'link', ext:'', raw:'' };
  return { type:'unknown', ext:'', raw:'' };
}

// ── PLATFORM AUTO-DETECTION ─────────────────
const PLAT_RULES = [
  { test: u => /raw\.githubusercontent\.com|github\.com/.test(u),   key:'github'   },
  { test: u => /mega\.nz|mega\.co\.nz/.test(u),                     key:'mega'     },
  { test: u => /terabox\.com|teraboxapp\.com/.test(u),               key:'terabox'  },
  { test: u => /drive\.google\.com|docs\.google\.com/.test(u),       key:'drive'    },
  { test: u => /mediafire\.com/.test(u),                             key:'mediafire'},
  { test: u => /dropbox\.com/.test(u),                               key:'dropbox'  },
  { test: u => /onedrive\.live\.com|1drv\.ms/.test(u),               key:'onedrive' },
];
const PLAT_CFG = {
  github:   {l:'GitHub',    chip:'ch-github'},
  mega:     {l:'MEGA',      chip:'ch-mega'},
  terabox:  {l:'Terabox',   chip:'ch-terabox'},
  drive:    {l:'Drive',     chip:'ch-drive'},
  mediafire:{l:'MediaFire', chip:'ch-mediafire'},
  dropbox:  {l:'Dropbox',   chip:'ch-dropbox'},
  onedrive: {l:'OneDrive',  chip:'ch-onedrive'},
  ext:      {l:'Externo',   chip:'ch-ext'},
};
function detectPlatform(url=''){
  for(const r of PLAT_RULES) if(r.test(url)) return r.key;
  return 'ext';
}

// ── COLOR POOL ──────────────────────────────
const POOL = ['--c0','--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
const cmap = {};
let cidx = 0;
function cc(slug){
  if(!cmap[slug]){ cmap[slug]=POOL[cidx%POOL.length]; cidx++; }
  return `var(${cmap[slug]})`;
}
function cb(slug){ return cmap[slug]?`var(${cmap[slug]}b)`:'rgba(255,255,255,.05)'; }

const CAT_EMOJI = {
  libreria:'📚',biblioteca:'📚',juegos:'🎮',tv:'📺',multimedia:'🎵',
  random:'🎲',dev:'🧰',apps:'📱',archivos:'🗂',cursos:'🎓',software:'💾',musica:'🎵'
};
function cEmoji(s){ return CAT_EMOJI[(s||'').toLowerCase()]||'📁'; }
function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):''; }
function fmtSize(b){ if(!b)return '—'; if(b<1024)return b+'B'; if(b<1048576)return (b/1024).toFixed(1)+'KB'; return (b/1048576).toFixed(1)+'MB'; }

// ── STATE ────────────────────────────────────
let DB        = [];  // all resolved items
let favorites = loadFavs();
let curCat    = 'all';
let curSub    = null;
let favOnly   = false;
let detailId  = null;

// ── STORAGE ──────────────────────────────────
function loadFavs(){ try{ return new Set(JSON.parse(localStorage.getItem(CFG.favKey))||[]); }catch{ return new Set(); } }
function saveFavs(){ localStorage.setItem(CFG.favKey,JSON.stringify([...favorites])); }
function saveCache(data){ localStorage.setItem(CFG.cacheKey,JSON.stringify({ts:Date.now(),data})); }
function loadCache(){
  try{
    const raw=localStorage.getItem(CFG.cacheKey); if(!raw) return null;
    const {ts,data}=JSON.parse(raw);
    if(Date.now()-ts>CFG.cacheTTL) return null;
    return data;
  }catch{ return null; }
}

// ── GITHUB FETCH ─────────────────────────────
async function ghGet(path=''){
  const url = path ? `${API}/${path}` : API;
  const res = await fetch(url, {headers:{'Accept':'application/vnd.github.v3+json'}});
  if(res.status===404) throw Object.assign(new Error('NOT_FOUND'),{code:404});
  if(res.status===403) throw Object.assign(new Error('RATE_LIMIT'),{code:403});
  if(!res.ok) throw new Error('GH_ERR_'+res.status);
  return res.json();
}
async function ghRaw(path){
  try{ const r=await fetch(`${RAW}/${path}`); return r.ok?await r.json():{}; }catch{ return {}; }
}

// ── FULL SYNC ────────────────────────────────
async function fullSync(){
  setBadge('loading','Sincronizando…');
  try{
    DB = await buildDB();
    saveCache(DB);
    buildNav();
    renderGrid();
    setBadge('ok',`✓ ${DB.length} items`);
    toast('Sincronizado 🍋','ok');
  } catch(e){
    handleSyncError(e);
  }
}

async function buildDB(){
  const items = [];

  // 1. Read root of repo
  let root;
  try{ root = await ghGet(); }
  catch(e){
    if(e.code===404) throw Object.assign(e,{friendly:'Repositorio no encontrado.'});
    if(e.code===403) throw Object.assign(e,{friendly:'Límite de peticiones GitHub alcanzado. Espera unos minutos.'});
    throw e;
  }

  // Reserved system folder name — excluded from library
  const RESERVED = '_system';
  const isReserved = name => name === RESERVED || name.startsWith('_system/');

  const catDirs = root.filter(f =>
    f.type === 'dir' &&
    !f.name.startsWith('.') &&
    f.name !== RESERVED       // exclude _system entirely
  );

  for(const catDir of catDirs){
    const catSlug = catDir.name;
    cc(catSlug); // register color

    const catContents = await ghGet(catSlug);
    const subdirs     = catContents.filter(f=>f.type==='dir');
    const directFiles = catContents.filter(f=>f.type==='file'&&!f.name.startsWith('.')&&f.name!=='metadata.json'&&f.name!=='links.json');

    // Load category-level metadata & links
    const catMeta  = await ghRaw(`${catSlug}/metadata.json`);
    const catLinks = await ghRaw(`${catSlug}/links.json`);

    // Direct files in category
    directFiles.forEach(f=>{
      items.push(buildGHItem(f, catSlug, '', catMeta));
    });

    // Category-level external links
    if(Array.isArray(catLinks)){
      catLinks.forEach(l=>{ if(l.nombre&&l.url) items.push(buildLinkItem(l, catSlug, l.subcategoria||'')); });
    }

    // Subcategories
    for(const sub of subdirs){
      const subContents = await ghGet(`${catSlug}/${sub.name}`);
      const subFiles    = subContents.filter(f=>f.type==='file'&&!f.name.startsWith('.')&&f.name!=='metadata.json'&&f.name!=='links.json');
      const subMeta     = await ghRaw(`${catSlug}/${sub.name}/metadata.json`);
      const subLinks    = await ghRaw(`${catSlug}/${sub.name}/links.json`);

      subFiles.forEach(f=>{ items.push(buildGHItem(f, catSlug, sub.name, subMeta)); });
      if(Array.isArray(subLinks)){
        subLinks.forEach(l=>{ if(l.nombre&&l.url) items.push(buildLinkItem(l, catSlug, l.subcategoria||sub.name)); });
      }
    }
  }

  // Root-level links.json (global external links)
  const rootLinks = await ghRaw('links.json');
  if(Array.isArray(rootLinks)){
    rootLinks.forEach(l=>{
      if(l.nombre&&l.url&&l.categoria){
        cc(l.categoria);
        items.push(buildLinkItem(l, l.categoria, l.subcategoria||''));
      }
    });
  }

  return items;
}

function resolveThumb(thumb){
  // If thumbnail is a _system relative path, convert it to a full raw GitHub URL
  if(!thumb) return '';
  if(thumb.startsWith('http://') || thumb.startsWith('https://')) return thumb;
  // Treat as relative path inside the repo (e.g. "_system/img/cover.jpg")
  return `${RAW}/${thumb}`;
}

function buildGHItem(file, cat, sub, meta={}){
  const info  = meta[file.name] || {};
  const tinfo = detectType(file.name, file.download_url);
  const plat  = detectPlatform(file.download_url||'');
  const autoName = file.name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ');
  return {
    id:       `gh::${cat}::${sub}::${file.name}`,
    source:   'github',
    name:     info.titulo       || autoName,
    category: cat,
    sub:      sub,
    desc:     info.descripcion  || '',
    format:   info.formato      || tinfo.ext,
    thumb:    resolveThumb(info.thumbnail || ''),
    url:      file.download_url || '',
    platform: plat,
    type:     tinfo.type,
    ext:      tinfo.raw,
    size:     file.size         || 0,
    tags:     info.etiquetas    || [],
    fecha:    info.fecha        || null,
  };
}

function buildLinkItem(link, cat, sub){
  const plat  = detectPlatform(link.url||'');
  const tinfo = detectType(link.nombre||'', link.url||'');
  const finalType = tinfo.type==='unknown' ? 'link' : tinfo.type;
  return {
    id:       `lk::${cat}::${sub}::${encodeURIComponent(link.url)}`,
    source:   'link',
    name:     link.nombre,
    category: cat,
    sub:      sub,
    desc:     link.descripcion  || '',
    format:   link.formato      || tinfo.ext || PLAT_CFG[plat]?.l || 'Link',
    thumb:    resolveThumb(link.thumbnail || ''),
    url:      link.url,
    platform: plat,
    type:     finalType,
    ext:      tinfo.raw,
    size:     0,
    tags:     link.tags         || [],
    fecha:    link.fecha        || null,
  };
}

function handleSyncError(e){
  const msg = e.friendly || (e.code===404?'Repositorio no encontrado. Créalo primero en GitHub.'
    : e.code===403?'Límite de peticiones GitHub. Espera unos minutos e intenta de nuevo.'
    : 'Error de conexión con GitHub.');
  setBadge('err','Sin conexión');
  toast(msg,'err');
  // Still render whatever is in DB (could be from cache)
  buildNav(); renderGrid();
}

function setBadge(cls, txt){
  const b=document.getElementById('syncBadge');
  b.className='sync-badge '+cls; b.textContent=txt;
}

// ── NAV ──────────────────────────────────────
function buildNav(){
  const nav  = document.getElementById('navCats');
  const cats = [...new Set(DB.map(i=>i.category).filter(Boolean))];
  nav.innerHTML=`<button class="nav-cat ${curCat==='all'?'active':''}" data-cat="all" onclick="setFilter('all')">
    Todo <span class="nc" id="cnt-all">${DB.length}</span></button>`;
  cats.forEach(cat=>{
    const n   = DB.filter(i=>i.category===cat).length;
    const col = cc(cat);
    const active = curCat===cat;
    const btn = document.createElement('button');
    btn.className='nav-cat'+(active?' active':'');
    btn.dataset.cat=cat;
    btn.onclick=()=>setFilter(cat);
    btn.innerHTML=`${cEmoji(cat)} ${cap(cat)} <span class="nc">${n}</span>`;
    if(active){ btn.style.color=col; btn.style.borderBottomColor=col; }
    nav.appendChild(btn);
  });
}

// ── RENDER ───────────────────────────────────
function renderGrid(){
  const q    = document.getElementById('srchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSel').value;

  let list = DB.filter(item=>{
    if(curCat!=='all'&&item.category!==curCat) return false;
    if(curSub&&item.sub!==curSub) return false;
    if(favOnly&&!favorites.has(item.id)) return false;
    if(q){
      const hay=[item.name,item.desc,item.category,item.sub,item.format,...item.tags].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a,b)=>{
    if(sort==='za') return (b.name||'').localeCompare(a.name||'');
    if(sort==='cat') return (a.category||'').localeCompare(b.category||'') || (a.name||'').localeCompare(b.name||'');
    if(sort==='fmt') return (a.format||'').localeCompare(b.format||'');
    return (a.name||'').localeCompare(b.name||''); // az default
  });

  document.getElementById('gc').textContent=`${list.length} item${list.length!==1?'s':''}`;
  document.getElementById('cnt-all').textContent=DB.length;
  renderSubcats();

  const grid=document.getElementById('grid');
  if(!list.length){
    grid.innerHTML=`<div class="empty">
      <div class="empty-ic">${DB.length===0?'🍋':'🔍'}</div>
      <h3>${DB.length===0?'LemonBox está vacío':'Sin resultados'}</h3>
      <p>${DB.length===0?'Crea carpetas y archivos en tu repo de GitHub y dale Sync.':'Prueba con otro filtro o búsqueda.'}</p>
    </div>`;
    return;
  }
  grid.innerHTML = list.map((item,i)=>cardHTML(item,i)).join('');
}

function cardHTML(item, i){
  const col   = cc(item.category);
  const bg    = cb(item.category);
  const plat  = PLAT_CFG[item.platform]||PLAT_CFG.ext;
  const tIcon = TYPE_ICONS[item.type]||TYPE_ICONS.unknown;
  const isFav = favorites.has(item.id);
  const isDL  = isDirect(item);

  let thumbHTML;
  if(item.thumb){
    thumbHTML=`<div class="c-thumb"><img src="${esc(item.thumb)}" alt="${esc(item.name)}"
      onerror="this.parentElement.innerHTML='<div class=\\'c-thumb-ph\\'style=\\'background:${bg}\\'><div class=\\'ph-ic\\'>${tIcon}</div><div class=\\'ph-ft\\'>${esc(item.format)}</div></div>'">
    </div>`;
  } else {
    thumbHTML=`<div class="c-thumb"><div class="c-thumb-ph" style="background:${bg}">
      <div class="ph-ic">${tIcon}</div>
      <div class="ph-ft">${esc(item.format)}</div>
    </div></div>`;
  }

  const srcBadge = item.source==='github'
    ? '<span class="c-src gh">AUTO</span>'
    : '<span class="c-src ext">EXT</span>';

  return `
  <div class="card" data-id="${esc(item.id)}"
    style="--cat-c:${col};animation-delay:${Math.min(i,18)*32}ms"
    onclick="openDM('${esc(item.id)}')" >
    <style>.card[data-id="${esc(item.id)}"]::before{background:${col};}</style>
    ${srcBadge}
    <button class="c-fav ${isFav?'on':''}"
      onclick="event.stopPropagation();toggleFav('${esc(item.id)}')" title="Favorito">
      ${isFav?'⭐':'☆'}
    </button>
    ${thumbHTML}
    <div class="c-body">
      <div class="c-tags">
        <span class="tag" style="color:${col};background:${bg};border-color:${col}40">${cap(item.category)}</span>
        ${item.sub?`<span class="tag tag-sub">${esc(item.sub)}</span>`:''}
      </div>
      <div class="c-title">${esc(item.name)}</div>
      <div class="c-desc">${item.desc?esc(item.desc):'<span style="opacity:.28;font-style:italic">Sin descripción</span>'}</div>
      <div class="c-chips">
        <span class="chip ${plat.chip}">${plat.l}</span>
        ${item.format?`<span class="chip ch-fmt">${esc(item.format)}</span>`:''}
      </div>
    </div>
    <div class="c-foot" onclick="event.stopPropagation()">
      <button class="btn-ver" style="background:${col};color:var(--bg)"
        onclick="event.stopPropagation();openDM('${esc(item.id)}')">
        ${tIcon} Ver
      </button>
      <a class="btn-dl" href="${esc(item.url)}"
        ${isDL?'download':'target="_blank" rel="noopener"'}
        title="Descargar">⬇</a>
    </div>
  </div>`;
}

function isDirect(item){
  return item.platform==='github'&&(
    (item.url||'').includes('raw.githubusercontent.com')||
    (item.url||'').includes('/raw/')||
    (item.url||'').includes('/releases/')
  );
}

// ── SUBCAT ───────────────────────────────────
function renderSubcats(){
  const bar=document.getElementById('subcatBar');
  if(curCat==='all'){bar.classList.add('hidden');curSub=null;return;}
  const subs=[...new Set(DB.filter(i=>i.category===curCat).map(i=>i.sub).filter(Boolean))];
  if(!subs.length){bar.classList.add('hidden');curSub=null;return;}
  if(curSub&&!subs.includes(curSub)) curSub=null;
  bar.classList.remove('hidden');
  bar._subs=subs;
  const col=cc(curCat);
  bar.innerHTML=`<span class="sub-lbl">SUB ›</span>
    <button class="spill" style="${!curSub?`color:${col};border-color:${col};background:${col}14`:''}"
      onclick="setSub(-1)">Todos</button>
    ${subs.map((s,i)=>`
      <button class="spill" style="${curSub===s?`color:${col};border-color:${col};background:${col}14`:''}"
        onclick="setSub(${i})">${s}</button>`).join('')}`;
}

// ── FILTERS ──────────────────────────────────
function setFilter(cat){
  curCat=cat; curSub=null;
  document.getElementById('srchInput').value='';
  document.querySelectorAll('.nav-cat').forEach(b=>{
    const a=b.dataset.cat===cat;
    b.classList.toggle('active',a);
    const col=a?(cat==='all'?'var(--lemon)':cc(cat)):'';
    b.style.color=col; b.style.borderBottomColor=col;
  });
  renderGrid();
}
function setSub(i){
  const bar=document.getElementById('subcatBar');
  curSub=(i===-1||!bar._subs)?null:(bar._subs[i]??null);
  renderGrid();
}
function toggleFavFilter(){
  favOnly=!favOnly;
  document.getElementById('favBtn').classList.toggle('active',favOnly);
  renderGrid();
}

// ── FAVORITES ────────────────────────────────
function toggleFav(id){
  favorites.has(id)?favorites.delete(id):favorites.add(id);
  saveFavs(); renderGrid();
  if(detailId===id){
    const b=document.getElementById('dmFavBtn');
    const on=favorites.has(id);
    b.classList.toggle('on',on); b.textContent=on?'⭐':'☆';
  }
}
function toggleFavDM(){ if(detailId) toggleFav(detailId); }

// ── DETAIL MODAL ─────────────────────────────
function openDM(id){
  const item=DB.find(i=>i.id===id); if(!item) return;
  detailId=id;
  const col  = cc(item.category);
  const bg   = cb(item.category);
  const plat = PLAT_CFG[item.platform]||PLAT_CFG.ext;
  const tIcon= TYPE_ICONS[item.type]||TYPE_ICONS.unknown;
  const tLbl = TYPE_LABELS[item.type]||'Archivo';
  const isFav= favorites.has(id);
  const isDL = isDirect(item);

  // Hero image
  const hero=document.getElementById('dmHero');
  [...hero.querySelectorAll(':not(.dm-close):not(.dm-fav-btn)')].forEach(e=>e.remove());
  if(item.thumb){
    const img=document.createElement('img');
    img.src=item.thumb;
    img.onerror=()=>{ img.remove(); hero.insertAdjacentHTML('afterbegin',`<div class="dm-hero-ph" style="background:${bg}">${tIcon}</div>`); };
    hero.insertAdjacentElement('afterbegin',img);
  } else {
    hero.insertAdjacentHTML('afterbegin',`<div class="dm-hero-ph" style="background:${bg}">${tIcon}</div>`);
  }

  const fb=document.getElementById('dmFavBtn');
  fb.classList.toggle('on',isFav); fb.textContent=isFav?'⭐':'☆';

  document.getElementById('dmTitle').textContent=item.name;

  const dd=document.getElementById('dmDesc');
  dd.textContent=item.desc||''; dd.style.display=item.desc?'':'none';

  // Meta grid
  const metaRows=[
    {l:'Categoría',   v:cap(item.category)},
    {l:'Subcategoría',v:item.sub||'—'},
    {l:'Tipo',        v:tLbl},
    {l:'Formato',     v:item.format||'—'},
    {l:'Plataforma',  v:plat.l},
    item.size?{l:'Tamaño',v:fmtSize(item.size)}:null,
    item.fecha?{l:'Fecha',v:item.fecha}:null,
  ].filter(Boolean);
  document.getElementById('dmMeta').innerHTML=metaRows.map(m=>`
    <div class="dm-mi"><div class="dm-ml">${m.l}</div><div class="dm-mv">${m.v}</div></div>`).join('');

  // Tags
  const allTags=[item.category,item.sub,...item.tags].filter(Boolean);
  const dt=document.getElementById('dmTags');
  dt.innerHTML=allTags.map(t=>`<span class="tag" style="color:${col};background:${bg};border-color:${col}40">${esc(t)}</span>`).join('');
  dt.style.display=allTags.length?'flex':'none';

  document.getElementById('dmUrl').textContent=item.url||'Sin URL';

  // Smart viewer
  const dv=document.getElementById('dmViewer');
  dv.innerHTML='';
  const viewerHTML=buildViewer(item);
  if(viewerHTML) dv.innerHTML=viewerHTML;

  // Actions
  const dlAttr=isDL?'download':`target="_blank" rel="noopener"`;
  const dlLabel=isDL?'⬇ Descargar':'↗ Abrir';
  document.getElementById('dmActs').innerHTML=`
    <a class="dmbtn dmbtn-p" href="${esc(item.url)}" ${dlAttr}
      style="background:${col};color:var(--bg)">${tIcon} Ver</a>
    <a class="dmbtn dmbtn-g" href="${esc(item.url)}" ${dlAttr}>${dlLabel}</a>`;

  document.getElementById('dmOv').classList.add('open');
  document.body.style.overflow='hidden';
}

function buildViewer(item){
  const u=item.url||'';
  const e=item.ext||'';
  // Only inline-viewable types from GitHub raw or direct links
  const canInline = item.platform==='github' || ['image','audio','video'].includes(item.type);
  if(!canInline) return `<div class="viewer"><div class="viewer-info">
    Este archivo está alojado en <strong>${PLAT_CFG[item.platform]?.l||'plataforma externa'}</strong>.<br>
    Usa el botón <strong>Ver</strong> para abrirlo en su plataforma correspondiente.</div></div>`;

  if(item.type==='image')
    return `<div class="viewer"><img src="${esc(u)}" alt="${esc(item.name)}" loading="lazy"></div>`;

  if(item.type==='audio')
    return `<div class="viewer"><audio controls src="${esc(u)}"></audio></div>`;

  if(item.type==='video'&&['mp4','webm'].includes(e))
    return `<div class="viewer"><video controls src="${esc(u)}"></video></div>`;

  if(item.type==='book'&&e==='pdf'){
    // PDF viewer via iframe (works for raw github or direct links)
    const viewerUrl=`https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(u)}`;
    return `<div class="viewer"><iframe src="${viewerUrl}" title="PDF Viewer"></iframe></div>`;
  }
  return '';
}

function closeDM(){
  document.getElementById('dmOv').classList.remove('open');
  document.body.style.overflow=''; detailId=null;
}

// ── STATS ────────────────────────────────────
function openStats(){
  const total=DB.length;
  const favN=[...favorites].filter(id=>DB.find(i=>i.id===id)).length;
  const ghN=DB.filter(i=>i.source==='github').length;
  const lkN=DB.filter(i=>i.source==='link').length;

  const bycat={},bytype={},byplat={};
  DB.forEach(i=>{
    bycat[i.category]=(bycat[i.category]||0)+1;
    bytype[i.type]=(bytype[i.type]||0)+1;
    byplat[i.platform]=(byplat[i.platform]||0)+1;
  });

  const catRows=Object.entries(bycat).sort((a,b)=>b[1]-a[1]).map(([cat,n])=>`
    <div class="sm-row">
      <span>${cEmoji(cat)} ${cap(cat)}</span>
      <span style="color:${cc(cat)};font-family:'Space Mono',monospace;font-size:.75rem">${n}</span>
    </div>
    <div class="sm-bar" style="background:${cc(cat)};width:${total?Math.round(n/total*100):0}%"></div>`).join('');

  const typeRows=Object.entries(bytype).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t,n])=>`
    <div class="sm-row">
      <span>${TYPE_ICONS[t]||'📄'} ${TYPE_LABELS[t]||t}</span>
      <span style="font-family:'Space Mono',monospace;font-size:.74rem;color:var(--muted)">${n}</span>
    </div>`).join('');

  const platRows=Object.entries(byplat).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`
    <div class="sm-row">
      <span>${PLAT_CFG[p]?.l||p}</span>
      <span style="font-family:'Space Mono',monospace;font-size:.74rem;color:var(--muted)">${n}</span>
    </div>`).join('');

  document.getElementById('smContent').innerHTML=`
    <div class="sm-grid">
      <div class="sm-card"><div class="sm-n">${total}</div><div class="sm-l">Total items</div></div>
      <div class="sm-card"><div class="sm-n" style="color:var(--lemon)">${favN}</div><div class="sm-l">Favoritos ⭐</div></div>
      <div class="sm-card"><div class="sm-n" style="color:#34d399">${ghN}</div><div class="sm-l">Desde GitHub</div></div>
      <div class="sm-card"><div class="sm-n" style="color:#60a5fa">${lkN}</div><div class="sm-l">Links externos</div></div>
    </div>
    <div class="sm-sec"><h3>Por categoría</h3>${catRows||noData()}</div>
    <div class="sm-sec"><h3>Por tipo</h3>${typeRows||noData()}</div>
    <div class="sm-sec"><h3>Por plataforma</h3>${platRows||noData()}</div>`;

  document.getElementById('smOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function noData(){ return `<p style="color:var(--muted);font-size:.78rem;padding:4px 0">Sin datos aún.</p>`; }
function closeStats(){
  document.getElementById('smOv').classList.remove('open');
  document.body.style.overflow='';
}

// ── HELPERS ──────────────────────────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className=`toast ${type}`;
  el.innerHTML=`<span>${type==='ok'?'✅':type==='inf'?'ℹ️':'❌'}</span> ${msg}`;
  document.getElementById('tc').appendChild(el);
  setTimeout(()=>el.remove(),3600);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeDM(); closeStats(); }
});

// ── INIT ─────────────────────────────────────
(async()=>{
  const cached=loadCache();
  if(cached){
    DB=cached;
    // Re-register colors from cache
    DB.forEach(i=>{ if(i.category) cc(i.category); });
    buildNav(); renderGrid();
    setBadge('ok',`✓ ${DB.length} items (caché)`);
    toast('Cargado desde caché 🍋','inf');
    // Background refresh after 2s
    setTimeout(fullSync, 2000);
  } else {
    buildNav(); renderGrid();
    await fullSync();
  }
})();
</script>
</body>
</html>
